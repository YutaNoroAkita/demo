<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="header-top">
                <h1>🛠 Dev Task Tracker</h1>
                <span class="bug-badge">⚠ バグあり</span>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-label">Total</span>
                    <strong id="total-count">0</strong>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Active</span>
                    <strong id="active-count" class="text-accent">0</strong>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Done</span>
                    <strong id="done-count" class="text-success">0</strong>
                </div>
            </div>
        </header>

        <div class="input-section">
            <input type="text" id="task-input" placeholder="新しいタスクを入力..." autocomplete="off" />
            <select id="priority-select">
                <option value="low">低</option>
                <option value="medium" selected>中</option>
                <option value="high">高</option>
            </select>
            <button id="add-btn">追加</button>
        </div>

        <div id="task-list" class="task-list"></div>

        <footer>
            <button id="clear-completed" class="btn-ghost">完了済みを削除</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
